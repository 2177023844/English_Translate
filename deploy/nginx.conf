# 果冻学英语 — Nginx 配置
# 用途：HTTPS 终结 + 反代 Node 服务（127.0.0.1:3001）
# 说明：麦克风跟读功能要求 HTTPS，必须用 certbot 配置证书后启用 443。
#
# 使用方法：
#   1. 替换 <your-domain.com> 为你的域名
#   2. 复制到 /etc/nginx/sites-available/vocab，软链到 sites-enabled
#   3. certbot --nginx -d <your-domain.com>   # 自动签发并改写配置
#   4. nginx -t && systemctl reload nginx

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain.com>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 22.04/24.04 自带 nginx 1.18–1.24 不支持 "http2 on;"，用监听参数写法兼容
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <your-domain.com>;

    # 试卷上传：Express 端单文件上限 30MB、单次总上限 200MB
    client_max_body_size 200m;

    # certbot 自动填写的证书路径
    ssl_certificate     /etc/letsencrypt/live/<your-domain.com>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain.com>/privkey.pem;

    # 个人使用可在此开启 Basic Auth 防止他人访问（可选）
    # auth_basic "Private";
    # auth_basic_user_file /etc/nginx/.htpasswd;   # htpasswd -c /etc/nginx/.htpasswd yourname

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传/导出可能超过默认 60s
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
